<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Directory Bruteforcer | Web UI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f111a;
            --text-main: #f0f4f8;
            --text-muted: #8b9bb4;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --card-bg: rgba(30, 33, 43, 0.6);
            --card-border: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image:
                radial-gradient(circle at 15% 50%, rgba(99, 102, 241, 0.15), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(16, 185, 129, 0.1), transparent 25%);
            background-attachment: fixed;
        }

        header {
            padding: 24px 48px;
            border-bottom: 1px solid var(--card-border);
            background: rgba(15, 17, 26, 0.8);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .brand-title {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(90deg, #f0f4f8, #8b9bb4);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-title span {
            color: var(--primary);
            -webkit-background-clip: unset;
            background-clip: unset;
            -webkit-text-fill-color: unset;
        }

        main {
            padding: 48px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 32px;
            flex: 1;
        }

        @media (max-width: 900px) {
            main {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 24px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        h2 {
            font-size: 18px;
            font-weight: 600;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, select {
            width: 100%;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            transition: all 0.2s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        .btn-launch {
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 8px;
        }

        .btn-launch:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .results-panel {
            height: calc(100vh - 180px);
            overflow: hidden;
        }

        .status-badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            margin-left: 8px;
            color: #fff;
        }

        .status-200 { background: var(--success); }
        .status-300 { background: var(--warning); }
        .status-400 { background: var(--danger); }
        .status-500 { background: darkred; }

        .log-line {
            padding: 10px 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            display: flex;
            align-items: center;
            justify-content: space-between;
            animation: fadeIn 0.3s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .progress-container {
            display: none;
            align-items: center;
            gap: 12px;
            margin-top: -10px;
        }

        .loader {
            width: 20px;
            height: 20px;
            border: 2px solid var(--text-muted);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s infinite linear;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .tabs {
            display: flex;
            gap: 4px;
            padding: 4px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            margin-bottom: 8px;
        }

        .tab {
            flex: 1;
            padding: 8px;
            text-align: center;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s;
            color: var(--text-muted);
        }

        .tab.active {
            background: var(--primary);
            color: #fff;
        }

        .tab-content {
            display: none;
            flex: 1;
            overflow-y: auto;
        }

        .tab-content.active { display: flex; flex-direction: column; }

        .log-entry {
            font-size: 12px;
            padding: 6px 10px;
            border-left: 2px solid transparent;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .log-entry.interesting {
            border-left-color: var(--success);
            background: rgba(16, 185, 129, 0.05);
        }

        #tech_badges {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 12px;
            min-height: 28px;
        }

        .tech-badge {
            background: rgba(139, 92, 246, 0.2);
            color: #c4b5fd;
            border: 1px solid rgba(139, 92, 246, 0.4);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            animation: fadeIn 0.4s ease-out;
            box-shadow: 0 2px 10px rgba(139, 92, 246, 0.1);
        }

        #waf_warning {
            display: none;
            background: rgba(239, 68, 68, 0.9);
            color: white;
            padding: 16px 24px;
            border-radius: 8px;
            font-weight: 600;
            align-items: center;
            gap: 12px;
            box-shadow: 0 8px 32px rgba(239, 68, 68, 0.3);
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            animation: fadeIn 0.3s ease-out;
            backdrop-filter: blur(8px);
        }
        
        #soft404_status {
            display: none;
            background: rgba(6, 182, 212, 0.1);
            border: 1px solid rgba(6, 182, 212, 0.3);
            color: #22d3ee;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 11px;
            margin-bottom: 12px;
            align-items: center;
            gap: 8px;
        }
    </style>
</head>

<body>
    <div id="waf_warning">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
        <span id="waf_warning_text">WAF detected!</span>
        <button onclick="document.getElementById('waf_warning').style.display='none'" style="background:none; border:none; color:white; cursor:pointer; margin-left:20px;">×</button>
    </div>

    <header>
        <div class="brand-title">Directory <span>Bruteforcer</span></div>
        <div style="display: flex; align-items: center; gap: 12px;">
            <div id="connection_status" style="font-size: 10px; color: var(--danger); background: rgba(239, 68, 68, 0.1); padding: 2px 8px; border-radius: 10px;">OFFLINE</div>
            <div style="font-size: 13px; color: var(--text-muted);">v0.7.0 &middot; Dirbrute Web</div>
        </div>
    </header>

    <main>
        <div class="panel">
            <h2><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg> Scan Configuration</h2>

            <div class="form-group">
                <label for="target_url">Target URL</label>
                <input type="url" id="target_url" placeholder="http://example.com" required value="http://localhost:8000">
            </div>

            <div class="form-group">
                <label for="wordlist_path">Wordlist Path</label>
                <input type="text" id="wordlist_path" placeholder="common.txt" value="common.txt">
                <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; text-transform: none; margin-top: 4px;">
                    <input type="checkbox" id="auto_wordlist" style="width:auto;" onchange="toggleInputs()"> <span>Smart Mode (Auto)</span>
                </label>
                <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; text-transform: none;">
                    <input type="checkbox" id="crawler_enabled" style="width:auto;"> <span>Enable HTML Crawler</span>
                </label>
            </div>

            <div class="form-group">
                <div style="display: flex; justify-content: space-between;">
                    <label for="threads">Threads</label>
                    <span id="concurrency_val" style="font-size: 11px; color: var(--primary); display: none;">Speed: 5x</span>
                </div>
                <input type="number" id="threads" value="10" min="1" max="100">
                <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; text-transform: none; margin-top: 4px;">
                    <input type="checkbox" id="auto_threads" style="width:auto;" onchange="toggleInputs()"> <span>Adaptive Threading</span>
                </label>
            </div>

            <div class="form-group">
                <label for="max_depth">Max Recursion Depth</label>
                <select id="max_depth">
                    <option value="1">1 (Base Level)</option>
                    <option value="2" selected>2 (One Level Deep)</option>
                    <option value="3">3 (Two Levels Deep)</option>
                </select>
            </div>

            <button class="btn-launch" id="btn_scan" onclick="startScan()">Launch Scan</button>

            <div class="progress-container" id="progress_indicator">
                <div class="loader"></div>
                <span style="font-size: 13px; color: var(--text-muted);" id="progress_text">Scanning...</span>
            </div>
        </div>

        <div class="panel results-panel">
            <div id="tech_badges"></div>
            <div id="soft404_status">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                <span id="soft404_text">Heuristic Protection Active</span>
            </div>

            <div class="tabs">
                <div class="tab active" onclick="switchTab('results')">Findings</div>
                <div class="tab" onclick="switchTab('logs')">Live Logs</div>
                <div class="tab" onclick="switchTab('crawler')">Crawler</div>
            </div>

            <div id="results_tab" class="tab-content active">
                <div id="results_container"></div>
            </div>
            <div id="logs_tab" class="tab-content">
                <div id="logs_container"></div>
            </div>
            <div id="crawler_tab" class="tab-content">
                <div id="crawler_container"></div>
            </div>
        </div>
    </main>

    <script>
        let eventSource = null;

        function getStatusClass(code) {
            if (code >= 200 && code < 300) return 'status-200';
            if (code >= 300 && code < 400) return 'status-300';
            if (code >= 400 && code < 500) return 'status-400';
            return 'status-500';
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.getElementById(`${tabName}_tab`).classList.add('active');
            document.querySelector(`.tab[onclick="switchTab('${tabName}')"]`).classList.add('active');
        }

        function toggleInputs() {
            const autoW = document.getElementById('auto_wordlist').checked;
            const autoT = document.getElementById('auto_threads').checked;
            document.getElementById('wordlist_path').disabled = autoW;
            document.getElementById('wordlist_path').style.opacity = autoW ? "0.4" : "1";
            document.getElementById('threads').disabled = autoT;
            document.getElementById('threads').style.opacity = autoT ? "0.4" : "1";
            document.getElementById('concurrency_val').style.display = autoT ? "inline" : "none";
        }

        async function startScan() {
            let url = document.getElementById('target_url').value.trim();
            const payload = {
                url,
                wordlist: document.getElementById('auto_wordlist').checked ? null : document.getElementById('wordlist_path').value.trim(),
                threads: parseInt(document.getElementById('threads').value),
                auto_wordlist: document.getElementById('auto_wordlist').checked,
                auto_threads: document.getElementById('auto_threads').checked,
                crawler: document.getElementById('crawler_enabled').checked,
                depth: parseInt(document.getElementById('max_depth').value)
            };

            document.getElementById('results_container').innerHTML = '';
            document.getElementById('logs_container').innerHTML = '';
            document.getElementById('crawler_container').innerHTML = '';
            document.getElementById('tech_badges').innerHTML = '';
            document.getElementById('soft404_status').style.display = 'none';
            document.getElementById('waf_warning').style.display = 'none';
            document.getElementById('btn_scan').disabled = true;
            document.getElementById('progress_indicator').style.display = 'flex';
            document.getElementById('progress_text').innerText = 'Starting...';

            if (eventSource) eventSource.close();

            try {
                const resp = await fetch('/api/scan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await resp.json();
                connectSSE(data.stream_id);
            } catch (err) {
                alert("Error: " + err.message);
                scanFinished();
            }
        }

        function connectSSE(streamId) {
            eventSource = new EventSource(`/api/scan/stream/${streamId}`);
            eventSource.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.event === "Start") {
                    document.getElementById('connection_status').innerText = "CONNECTED";
                    document.getElementById('connection_status').style.color = "var(--success)";
                    document.getElementById('progress_text').innerText = `Scanning ${data.total} paths...`;
                } else if (data.event === "Soft404") {
                    document.getElementById('soft404_status').style.display = 'flex';
                    document.getElementById('soft404_text').innerText = `Heuristic Protection Enabled (${data.length} bytes baseline)`;
                } else if (data.event === "TechFound") {
                    const container = document.getElementById('tech_badges');
                    if (![...container.children].some(el => el.innerText === data.name)) {
                        const b = document.createElement('div');
                        b.className = 'tech-badge';
                        b.innerText = data.name;
                        container.appendChild(b);
                    }
                } else if (data.event === "WafWarning") {
                    document.getElementById('waf_warning').style.display = 'flex';
                    document.getElementById('waf_warning_text').innerText = data.message;
                } else if (data.event === "Attempt") {
                    const el = document.createElement('div');
                    el.className = `log-entry ${data.is_interesting ? 'interesting' : ''}`;
                    el.innerHTML = `<span>TRY</span> <span style="margin-left:4px;">/${data.path}</span> <span style="float:right; font-weight:bold; color: ${data.is_interesting ? 'var(--success)' : 'var(--danger)'}">${data.status}</span>`;
                    const container = document.getElementById('logs_container');
                    container.appendChild(el);
                    if (container.children.length > 300) container.removeChild(container.firstChild);
                    document.getElementById('logs_tab').scrollTop = document.getElementById('logs_tab').scrollHeight;
                } else if (data.event === "Found") {
                    const res = data.result;
                    const el = document.createElement('div');
                    el.className = 'log-line';
                    el.innerHTML = `
                        <div style="display:flex; flex-direction:column;">
                            <span style="font-weight:600;">/${res.path}</span>
                            <span style="font-size:10px; color:var(--text-muted);">Len: ${res.length} ${res.title ? '&middot; ' + res.title : ''}</span>
                        </div>
                        <span class="status-badge ${getStatusClass(res.status)}">${res.status}</span>
                    `;
                    document.getElementById('results_container').appendChild(el);
                } else if (data.event === "Finished") {
                    document.getElementById('progress_text').innerText = `Completed. Found ${data.total_found}.`;
                    scanFinished(true);
                }
            };
        }

        function scanFinished(success = false) {
            document.getElementById('btn_scan').disabled = false;
            if (!success) document.getElementById('progress_indicator').style.display = 'none';
        }
    </script>
</body>
</html>
