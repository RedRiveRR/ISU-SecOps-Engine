[package]
name = "secops"
version = "0.5.0"
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.37", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
futures = "0.3"
colored = "2.1"
axum = "0.8.8"
tokio-stream = "0.1.18"
serde_json = "1.0.149"
serde = { version = "1.0.228", features = ["derive"] }
nipper = "0.1.9"

